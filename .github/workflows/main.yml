name: Deploy to RelaxDev

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to RelaxDev Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.RELAXDEV_REGISTRY }}
          username: ${{ secrets.RELAXDEV_USERNAME }}
          password: ${{ secrets.RELAXDEV_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.RELAXDEV_REGISTRY }}/awesomevpn:latest
            ${{ secrets.RELAXDEV_REGISTRY }}/awesomevpn:${{ github.sha }}
